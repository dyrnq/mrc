name: ci

on:
  push:
    branches:
      - 'distribution/v2'
      - 'main'
    tags:
      - '*'
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
  # schedule:
  #   - cron:  '0 21 * * 0,1,3,5'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: false
        matrix:
          vers:
          - "2.8.3"
          - "3.0.0"
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Inspect builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:  ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:    ${{ steps.buildx.outputs.status }}"
          echo "Flags:     ${{ steps.buildx.outputs.flags }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"
      - name: Build dockerfile (with no push)
        run: |
          latest_tag="--tag ${{ secrets.DOCKER_USERNAME }}/mrc:${{ matrix.vers }}";
          if [ "${{ matrix.vers }}" = "3.0.0" ]; then
            latest_tag="${latest_tag} --tag ${{ secrets.DOCKER_USERNAME }}/mrc:latest";
          fi
          echo $latest_tag;

          docker buildx build \
          --platform linux/amd64,linux/arm64/v8 \
          --build-arg DISTRIBUTION_VERSION=${{ matrix.vers }} \
          --output "type=image,push=false" \
          --file ./Dockerfile . \
          $latest_tag

      -
        name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      -
        name: Build dockerfile (with push)
        run: |
          latest_tag="--tag ${{ secrets.DOCKER_USERNAME }}/mrc:${{ matrix.vers }}";
          if [ "${{ matrix.vers }}" = "3.0.0" ]; then
            latest_tag="${latest_tag} --tag ${{ secrets.DOCKER_USERNAME }}/mrc:latest";
          fi

          echo $latest_tag;

          docker buildx build \
          --platform linux/amd64,linux/arm64/v8 \
          --build-arg DISTRIBUTION_VERSION=${{ matrix.vers }} \
          --output "type=image,push=true" \
          --file ./Dockerfile . \
          $latest_tag